name: Poster Studio MVP verification

# Verify draft PRs without requiring a main merge.
on:
  pull_request:
    paths:
      - '.github/workflows/tapndo-mvp-verification.yml'
      - 'src/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poster-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies (high and critical block)
        run: npm audit --omit=dev --audit-level=high --json > audit-production.json || { cat audit-production.json; exit 1; }
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-production-audit
          path: audit-production.json
          if-no-files-found: warn
          retention-days: 7
      - name: Node regression tests
        run: node --test scripts/*.test.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npx playwright test --workers=1 --reporter=line
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poster-playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
