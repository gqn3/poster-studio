name: Security and build gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-production:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Reject high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit
      - name: Compile production app
        run: npm run build
